name: Ground Truth Baseline

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/ground-truth-baseline.yml"
      - "scripts/generate_baseline_manifest.py"
      - "tests/test_generate_baseline_manifest.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package-lock.json"
      - "apps/web/package-lock.json"
      - "Dockerfile"
      - "src/toxicjoin/policy/policy.yaml"
      - "src/toxicjoin/benchmark/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ground-truth-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOXICJOIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TOXICJOIN_SOURCE_SHA }}

      - name: Verify checked-out revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TOXICJOIN_SOURCE_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked development environment
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv sync --frozen --extra dev

      - name: Run full Python test suite
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen pytest -q 2>&1 | tee pytest-3.11.log

      - name: Generate balanced benchmark evidence
        run: uv run --frozen toxicjoin-benchmark --output-dir artifacts/benchmark

      - name: Generate ground-truth manifest
        id: generate_manifest
        shell: bash
        run: |
          set +e
          checked_out_sha="$(git rev-parse HEAD)"
          uv run --frozen python scripts/generate_baseline_manifest.py \
            --source-sha "$TOXICJOIN_SOURCE_SHA" \
            --checked-out-sha "$checked_out_sha" \
            --pytest-log pytest-3.11.log \
            --benchmark-json artifacts/benchmark/benchmark.json \
            --output artifacts/baseline/baseline.json \
            > baseline-generation.log 2>&1
          status=$?
          cat baseline-generation.log
          exit "$status"

      - name: Upload ground-truth evidence bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-ground-truth-baseline
          path: |
            artifacts/baseline/baseline.json
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/benchmark.md
            pytest-3.11.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload baseline diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-ground-truth-diagnostics
          path: |
            baseline-generation.log
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/benchmark.md
            pytest-3.11.log
          if-no-files-found: warn
          retention-days: 14
