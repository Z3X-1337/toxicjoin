name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Set up exact Node.js and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install exact uv bootstrap
        run: python -m pip install --disable-pip-version-check "uv==0.8.4"

      - name: Verify project metadata matches the committed Python lock
        run: uv lock --check

      - name: Verify machine-readable authority
        run: >-
          python scripts/bootstrap.py verify
          --components python,uv,node,npm,docker,locks,contract

      - name: Reject lock-bypass and exact-surface drift
        run: python scripts/bootstrap.py audit

      - name: Sync exact development profile
        run: python scripts/bootstrap.py sync --extra dev

      - name: Validate bootstrap contract tests
        run: uv run --frozen pytest -q tests/test_bootstrap_contract.py

  bootstrap-native:
    needs: bootstrap-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11.15"
          - os: ubuntu-24.04
            python: "3.12.13"
          - os: windows-2025
            python: "3.11.9"
          - os: windows-2025
            python: "3.12.10"
          - os: macos-15-intel
            python: "3.11.9"
          - os: macos-15-intel
            python: "3.12.10"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PHASE3_EVIDENCE_DIR: .toxicjoin/phase3-evidence

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Set up exact Node.js and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install exact uv bootstrap
        run: python -m pip install --disable-pip-version-check "uv==0.8.4"

      - name: Verify exact toolchain and locks
        run: >-
          python scripts/bootstrap.py verify
          --components python,uv,node,npm,locks,contract
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/toolchain-preflight.json"

      - name: Frozen sync first pass
        run: >-
          python scripts/bootstrap.py sync
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/sync-first.json"

      - name: Frozen sync second pass
        run: >-
          python scripts/bootstrap.py sync
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/sync-second.json"

      - name: Verify sync idempotency
        run: >-
          python -c "import json,pathlib;
          root=pathlib.Path(r'${{ env.PHASE3_EVIDENCE_DIR }}');
          a=json.loads((root/'sync-first.json').read_text());
          b=json.loads((root/'sync-second.json').read_text());
          assert a['lock_hashes_after']==b['lock_hashes_after'];
          assert a['installed_package_identity']['sha256']==b['installed_package_identity']['sha256']"

      - name: Install root Node tooling from exact lock
        run: npm ci --no-audit --no-fund

      - name: Install frontend from exact lock
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck, test, and build frontend
        working-directory: apps/web
        run: npm run check

      - name: Verify fixture startup and readiness
        run: >-
          python scripts/bootstrap.py smoke
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/fixture-smoke.json"

      - name: Remove known generated TypeScript build state
        run: >-
          python -c "from pathlib import Path;
          Path('apps/web/tsconfig.tsbuildinfo').unlink(missing_ok=True)"

      - name: Verify worktree remains unchanged
        run: >-
          python scripts/bootstrap.py cleanliness
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/worktree-cleanliness.json"

      - name: Generate content-addressed bootstrap evidence
        run: >-
          python scripts/bootstrap.py evidence
          --output-dir "${{ env.PHASE3_EVIDENCE_DIR }}"

      - name: Upload exact-platform bootstrap evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-bootstrap-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ env.PHASE3_EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.15", "3.12.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install exact uv bootstrap and locked development profile
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          python scripts/bootstrap.py verify --components python,uv,locks,contract
          python scripts/bootstrap.py sync --extra dev

      - name: Lint
        run: uv run --frozen ruff check src tests scripts

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen pytest -q 2>&1 | tee pytest-${{ matrix.python-version }}.log

      - name: Generate benchmark evidence
        if: matrix.python-version == '3.11.15'
        run: uv run --frozen toxicjoin-benchmark --output-dir artifacts/benchmark

      - name: Upload benchmark evidence
        if: matrix.python-version == '3.11.15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-benchmark
          path: artifacts/benchmark/
          if-no-files-found: error
          retention-days: 30

      - name: Generate PPMC hard-gate evidence
        if: matrix.python-version == '3.11.15'
        run: >-
          uv run --frozen python -m toxicjoin.benchmark.ppmc_hard_gate
          --output-dir artifacts/ppmc-hard-gate

      - name: Upload PPMC hard-gate evidence
        if: matrix.python-version == '3.11.15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-ppmc-hard-gate
          path: artifacts/ppmc-hard-gate/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 14

  web:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"

      - name: Verify exact Node.js and npm
        shell: bash
        run: |
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"

      - name: Install pinned frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck, test, and build judge interface
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee web-check.log

      - name: Upload generated package lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-web-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload judge interface build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-judge-interface
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-web-check
          path: apps/web/web-check.log
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-24.04
    needs: [bootstrap-native, test, web]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag toxicjoin:ci .

      - name: Run hardened production container
        run: |
          docker volume create toxicjoin-ci-runtime
          docker run --detach \
            --name toxicjoin-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=volume,src=toxicjoin-ci-runtime,dst=/var/lib/toxicjoin \
            --publish 18000:8000 \
            toxicjoin:ci

      - name: Verify container identity and read-only root
        shell: bash
        run: |
          test "$(docker inspect --format '{{.Config.User}}' toxicjoin-ci)" = "10001:10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' toxicjoin-ci)" = "true"

      - name: Wait for application liveness
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/api/health > health.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload == {"status": "ok"}, payload
          PY
              exit 0
            fi
            sleep 2
          done
          docker logs toxicjoin-ci
          exit 1

      - name: Execute readiness and flagship flow through production container
        run: |
          python - <<'PY'
          import json
          import urllib.request

          origin = "http://127.0.0.1:18000"

          with urllib.request.urlopen(f"{origin}/", timeout=5) as response:
              html = response.read().decode("utf-8")
              assert "ToxicJoin" in html
              assert response.headers["Cache-Control"] == "no-cache, max-age=0"
              assert "frame-ancestors 'none'" in response.headers["Content-Security-Policy"]

          with urllib.request.urlopen(f"{origin}/api/health", timeout=5) as response:
              health = json.load(response)
              assert health == {"status": "ok"}, health

          with urllib.request.urlopen(f"{origin}/api/ready", timeout=5) as response:
              ready = json.load(response)
              assert ready["status"] == "ok"
              assert ready["mode"] == "fixture"
              assert ready["policy_version"]
              assert ready["database_ready"] is True
              assert ready["receipt_store_ready"] is True

          with urllib.request.urlopen(f"{origin}/api/benchmark/summary", timeout=5) as response:
              benchmark = json.load(response)
              assert benchmark["corpus"]["total"] == 30
              assert benchmark["metrics"]["false_allow_count"] == 0
              assert benchmark["gate_failures"] == []

          with urllib.request.urlopen(f"{origin}/api/demo/scenarios", timeout=5) as response:
              scenarios = json.load(response)["scenarios"]
          flagship = next(
              item for item in scenarios
              if item["scenario_id"] == "rewrite-churn-regions"
          )
          request = urllib.request.Request(
              f"{origin}/api/execute-safe",
              method="POST",
              data=json.dumps(flagship["request"]).encode("utf-8"),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              result = json.load(response)

          assert result["initial_decision"]["decision"] == "REWRITE"
          assert result["effective_decision"] == "ALLOW"
          assert result["verification"]["passed"] is True
          rows = result["verification"]["execution"]["rows"]
          assert len(rows) == 3
          assert {int(row[2]) for row in rows} == {40}
          assert result["receipt"]["execution"]["preview_row_count"] == 3
          assert "rows" not in result["receipt"]
          PY

      - name: Capture container logs
        if: always()
        run: docker logs toxicjoin-ci > toxicjoin-container.log 2>&1 || true

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-container-log
          path: toxicjoin-container.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up container
        if: always()
        run: |
          docker rm --force toxicjoin-ci || true
          docker volume rm toxicjoin-ci-runtime || true
