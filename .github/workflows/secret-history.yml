name: Secret History Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TOXICJOIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact source revision with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TOXICJOIN_SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify source revision and fetch every branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOXICJOIN_SOURCE_SHA"
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse HEAD)" = "$TOXICJOIN_SOURCE_SHA"

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$url" --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          test -x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version | grep -F "$GITLEAKS_VERSION"

      - name: Scan all reachable Git history with full redaction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --no-banner \
            --no-color \
            --log-level error \
            --redact=100 \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            --log-opts="--all" \
            .
          status=$?
          set -e
          if [ ! -s "$RUNNER_TEMP/gitleaks-report.json" ]; then
            printf '[]\n' > "$RUNNER_TEMP/gitleaks-report.json"
          fi
          echo "GITLEAKS_EXIT_CODE=$status" >> "$GITHUB_ENV"

      - name: Generate non-disclosing scan evidence
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          commit_count="$(git rev-list --all --count)"
          ref_count="$(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags \
            | grep -v '^refs/remotes/origin/HEAD$' | wc -l | tr -d ' ')"
          python scripts/summarize_secret_history.py \
            --report "$RUNNER_TEMP/gitleaks-report.json" \
            --source-sha "$TOXICJOIN_SOURCE_SHA" \
            --checked-out-sha "$checked_out_sha" \
            --commit-count "$commit_count" \
            --ref-count "$ref_count" \
            --scanner-version "$GITLEAKS_VERSION" \
            --scanner-asset-sha256 "$GITLEAKS_ARCHIVE_SHA256" \
            --scanner-exit-code "$GITLEAKS_EXIT_CODE" \
            --output artifacts/secret-history/summary.json
          rm -f "$RUNNER_TEMP/gitleaks-report.json"

      - name: Enforce zero-findings gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("artifacts/secret-history/summary.json").read_text(encoding="utf-8")
          )
          safe = {
              "clean": summary["result"]["clean"],
              "finding_count": summary["result"]["finding_count"],
              "rule_counts": summary["result"]["rule_counts"],
              "commit_count": summary["coverage"]["commit_count"],
              "ref_count": summary["coverage"]["ref_count"],
              "scanner_error": summary["scanner"]["scanner_error"],
          }
          print(json.dumps(safe, sort_keys=True))
          if summary["scanner"]["scanner_error"]:
              raise SystemExit("Gitleaks scanner failed")
          if not summary["result"]["clean"]:
              raise SystemExit("Secret-history findings detected")
          PY

      - name: Upload sanitized secret-history evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-secret-history
          path: artifacts/secret-history/summary.json
          if-no-files-found: error
          retention-days: 30
