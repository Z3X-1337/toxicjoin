name: Secret History Security

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/secret-history.yml"
      - "scripts/summarize_secret_history_scan.py"
      - "tests/test_summarize_secret_history_scan.py"
      - "docs/threat-model.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOXICJOIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Check out exact source with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TOXICJOIN_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and fetch all branch/tag refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOXICJOIN_SOURCE_SHA"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --prune --tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          mkdir -p artifacts/secret-history
          git rev-list --all --count | tr -d '[:space:]' > artifacts/secret-history/commit-count.txt
          git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags \
            | wc -l | tr -d '[:space:]' > artifacts/secret-history/ref-count.txt
          printf '%s\n' "$TOXICJOIN_SOURCE_SHA" > artifacts/secret-history/source-sha.txt

      - name: Install pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version | tee artifacts/secret-history/scanner-version.txt
          printf '%s\n' "$GITLEAKS_ARCHIVE_SHA256" > artifacts/secret-history/scanner-archive-sha256.txt

      - name: Scan all reachable Git history
        shell: bash
        run: |
          set -uo pipefail
          raw_report="$RUNNER_TEMP/gitleaks-raw.json"
          "$RUNNER_TEMP/gitleaks" git \
            --no-banner \
            --redact \
            --report-format json \
            --report-path "$raw_report" \
            --log-opts="--all" \
            .
          scan_code=$?
          printf '%s\n' "$scan_code" > artifacts/secret-history/scan-exit-code.txt
          if [ ! -f "$raw_report" ]; then
            printf '[]\n' > "$raw_report"
          fi
          exit 0

      - name: Generate sanitized secret-history evidence
        shell: bash
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/gitleaks-raw.json"
          python3 scripts/summarize_secret_history_scan.py \
            --report "$raw_report" \
            --scan-exit-code "$(cat artifacts/secret-history/scan-exit-code.txt)" \
            --source-sha "$TOXICJOIN_SOURCE_SHA" \
            --scanner-version "$GITLEAKS_VERSION" \
            --scanner-archive-sha256 "$GITLEAKS_ARCHIVE_SHA256" \
            --commit-count "$(cat artifacts/secret-history/commit-count.txt)" \
            --ref-count "$(cat artifacts/secret-history/ref-count.txt)" \
            --output artifacts/secret-history/summary.json

      - name: Remove raw finding material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/gitleaks-raw.json" "$RUNNER_TEMP/gitleaks.tar.gz" "$RUNNER_TEMP/gitleaks"

      - name: Upload sanitized secret-history evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-secret-history
          path: |
            artifacts/secret-history/summary.json
            artifacts/secret-history/commit-count.txt
            artifacts/secret-history/ref-count.txt
            artifacts/secret-history/source-sha.txt
            artifacts/secret-history/scanner-version.txt
            artifacts/secret-history/scanner-archive-sha256.txt
            artifacts/secret-history/scan-exit-code.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce clean secret-history result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("artifacts/secret-history/summary.json")
          if not summary_path.is_file():
              raise SystemExit("Secret-history summary was not generated")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          status = summary.get("scan", {}).get("status")
          if status != "CLEAN":
              raise SystemExit(f"Secret-history gate failed with status: {status}")
          print(
              "Secret-history gate clean:",
              summary["git_scope"]["commit_count"],
              "commits across",
              summary["git_scope"]["ref_count"],
              "refs",
          )
          PY
