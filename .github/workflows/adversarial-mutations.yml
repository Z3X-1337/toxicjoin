name: Adversarial Mutation Evidence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: adversarial-mutations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-mutations:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ToxicJoin
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run adversarial mutation gate
        run: toxicjoin-adversarial --output-dir artifacts/adversarial-mutations

      - name: Upload adversarial mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-adversarial-mutations
          path: artifacts/adversarial-mutations/
          if-no-files-found: error
          retention-days: 30
