name: P4 Bandit Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/p4-bandit-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Run Bandit JSON diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv sync --frozen --no-install-project --extra security
          set +e
          .venv/bin/bandit -r src/toxicjoin -ll -ii -f json -o bandit.json
          RC=$?
          set -e
          printf '%s\n' "$RC" > bandit.exit-code.txt
          cat bandit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p4-bandit-diagnostics
          path: |
            bandit.json
            bandit.exit-code.txt
          if-no-files-found: error
          retention-days: 7
