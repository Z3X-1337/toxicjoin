name: Generated Release Manifest

on:
  pull_request:
    paths:
      - ".github/workflows/generated-release-manifest.yml"
      - ".github/workflows/phase8-durable-evidence.yml"
      - "scripts/generate_release_manifest_v2.py"
      - "scripts/generate_release_manifest_v3.py"
      - "scripts/release_manifest_gate.py"
      - "scripts/release_manifest_artifacts.py"
      - "scripts/phase5_manifest_validator.py"
      - "scripts/phase5_retention_policy.py"
      - "scripts/phase6_browser_release_manifest_contract.mjs"
      - "scripts/phase7_topology_evidence.py"
      - "scripts/phase8_durable_evidence.py"
      - "scripts/phase8_release_manifest.py"
      - "tests/test_generate_release_manifest.py"
      - "tests/test_phase8_durable_evidence.py"
      - "tests/test_phase8_release_manifest_contract.py"
      - "config/phase8-evidence-retention.json"
      - "evidence/retained/**"
      - "docs/phase7-acceptance.md"
      - "docs/phase8-acceptance.md"
      - "docs/durable-evidence.md"
      - "docs/release-manifest.md"
      - ".github/workflows/disclosure-sequence-evidence.yml"
  workflow_run:
    workflows: ["Ground Truth Baseline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-manifest-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  generator-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Verify locked generator contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.8.4"
          python scripts/bootstrap.py verify --components python,uv,locks,contract
          python scripts/bootstrap.py sync --extra dev
          uv run --frozen ruff check \
            scripts/generate_release_manifest_v2.py \
            scripts/generate_release_manifest_v3.py \
            scripts/release_manifest_gate.py \
            scripts/release_manifest_artifacts.py \
            scripts/phase7_topology_evidence.py \
            scripts/phase8_durable_evidence.py \
            scripts/phase8_release_manifest.py \
            tests/test_generate_release_manifest.py \
            tests/test_phase8_durable_evidence.py \
            tests/test_phase8_release_manifest_contract.py
          uv run --frozen pytest -q \
            tests/test_generate_release_manifest.py \
            tests/test_phase8_durable_evidence.py \
            tests/test_phase8_release_manifest_contract.py

  candidate-manifest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      TOXICJOIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      TOXICJOIN_HEAD_BRANCH: ${{ github.head_ref }}
      TOXICJOIN_BASE_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TOXICJOIN_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity and current main
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$TOXICJOIN_SOURCE_SHA"
          current_main_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test -n "$current_main_sha"
          test "$current_main_sha" = "$TOXICJOIN_BASE_MAIN_SHA"
          git fetch --no-tags origin "$current_main_sha"
          git merge-base --is-ancestor "$current_main_sha" "$TOXICJOIN_SOURCE_SHA"
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "current_main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Generate fail-closed candidate manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/generate_release_manifest_v3.py \
            --mode candidate \
            --source-sha "$TOXICJOIN_SOURCE_SHA" \
            --checked-out-sha "${{ steps.identity.outputs.checked_out_sha }}" \
            --expected-head-branch "$TOXICJOIN_HEAD_BRANCH" \
            --current-main-sha "${{ steps.identity.outputs.current_main_sha }}" \
            --base-main-sha "$TOXICJOIN_BASE_MAIN_SHA" \
            --output artifacts/release/candidate-release-manifest.json
      - name: Verify emitted candidate manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/release/candidate-release-manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          claimed = payload.pop("manifest_sha256")
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          ).encode()
          assert hashlib.sha256(canonical).hexdigest() == claimed
          assert payload["schema_version"] == "2.1"
          assert payload["identity"]["mode"] == "candidate"
          assert payload["identity"]["source_sha"] == os.environ["TOXICJOIN_SOURCE_SHA"]
          assert payload["gate_summary"]["required_workflows"] == 12
          assert payload["gate_summary"]["all_required_gates_verified"] is True
          assert payload["claim_boundaries"]["phase8_started"] is True
          assert (
              payload["claim_boundaries"]["durable_evidence_retention"]
              == "git-content-addressed"
          )
          for key in ("missing", "stale", "skipped", "inapplicable"):
              assert payload["gate_summary"][key] == []
          PY
      - name: Upload exact-candidate release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-candidate-release-manifest
          path: artifacts/release/candidate-release-manifest.json
          if-no-files-found: error
          retention-days: 90

  release-manifest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      TOXICJOIN_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TOXICJOIN_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact current-main identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$TOXICJOIN_SOURCE_SHA"
          current_main_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$current_main_sha" = "$TOXICJOIN_SOURCE_SHA"
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "current_main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Generate exact-main release manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/generate_release_manifest_v3.py \
            --mode release \
            --source-sha "$TOXICJOIN_SOURCE_SHA" \
            --checked-out-sha "${{ steps.identity.outputs.checked_out_sha }}" \
            --expected-head-branch main \
            --current-main-sha "${{ steps.identity.outputs.current_main_sha }}" \
            --base-main-sha "${{ steps.identity.outputs.current_main_sha }}" \
            --output artifacts/release/release-manifest.json
      - name: Upload exact-main release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-generated-release-manifest
          path: artifacts/release/release-manifest.json
          if-no-files-found: error
          retention-days: 90
