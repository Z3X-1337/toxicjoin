name: Generated Release Manifest

on:
  pull_request:
    paths:
      - ".github/workflows/generated-release-manifest.yml"
      - "scripts/generate_release_manifest.py"
      - "tests/test_generate_release_manifest.py"
      - "scripts/generate_baseline_manifest.py"
      - ".github/workflows/ground-truth-baseline.yml"
  workflow_run:
    workflows: ["Ground Truth Baseline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-manifest-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  generator-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull-request source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked development environment
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv sync --frozen --extra dev

      - name: Validate release-manifest generator contract
        run: uv run --frozen pytest -q tests/test_generate_release_manifest.py

  generate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TOXICJOIN_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TOXICJOIN_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and current main
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$TOXICJOIN_SOURCE_SHA"
          current_main_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test -n "$current_main_sha"
          test "$current_main_sha" = "$TOXICJOIN_SOURCE_SHA"
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "current_main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Generate release manifest from exact-head evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/generate_release_manifest.py \
            --source-sha "$TOXICJOIN_SOURCE_SHA" \
            --checked-out-sha "${{ steps.identity.outputs.checked_out_sha }}" \
            --current-main-sha "${{ steps.identity.outputs.current_main_sha }}" \
            --output artifacts/release/release-manifest.json

      - name: Validate emitted manifest contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/release/release-manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema_version"] == "1.0"
          assert payload["release"]["source_sha"] == "${{ env.TOXICJOIN_SOURCE_SHA }}"
          assert payload["release"]["exact_checkout_verified"] is True
          assert payload["release"]["current_main_verified"] is True
          assert payload["gate_summary"]["all_required_workflows_passed"] is True
          assert len(payload["manifest_sha256"]) == 64
          PY

      - name: Upload generated release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-generated-release-manifest
          path: artifacts/release/release-manifest.json
          if-no-files-found: error
          retention-days: 90
