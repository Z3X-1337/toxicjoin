name: Live DataHub Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/datahub-live.yml"
      - "src/toxicjoin/api/**"
      - "src/toxicjoin/auth.py"
      - "src/toxicjoin/context/**"
      - "src/toxicjoin/integrations/**"
      - "src/toxicjoin/models.py"
      - "src/toxicjoin/sql/**"
      - "src/toxicjoin/policy/**"
      - "src/toxicjoin/rewrite/**"
      - "src/toxicjoin/verify/**"
      - "src/toxicjoin/pipeline.py"
      - "tests/security/test_secure_api_surface.py"
      - "tests/security/test_datahub_edited_governance.py"
      - "tests/security/test_datahub_mcp_least_privilege.py"
      - "tests/security/test_datahub_lineage_trust.py"
      - "tests/integration/test_datahub_spike.py"
      - "tests/integration/test_datahub_spike_authority.py"
      - "config/datahub-assets.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datahub-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-datahub:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATAHUB_GMS_URL: http://127.0.0.1:8080
      DATAHUB_GMS_TOKEN: local-quickstart-auth-disabled
      DATAHUB_GMS_READ_TOKEN: local-quickstart-auth-disabled
      DATAHUB_GMS_WRITE_TOKEN: local-quickstart-auth-disabled
      DATAHUB_MCP_COMMAND: uvx
      DATAHUB_MCP_ARGS: --from mcp-server-datahub==0.6.0 mcp-server-datahub
      DATAHUB_MCP_TIMEOUT_SECONDS: "90"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune --all --force || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ToxicJoin and live DataHub dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv sync --frozen --extra datahub
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/datahub version
          uvx --from mcp-server-datahub==0.6.0 mcp-server-datahub --help >/dev/null 2>&1 || true

      - name: Start DataHub OSS quickstart
        shell: bash
        run: |
          set -o pipefail
          datahub docker quickstart 2>&1 | tee datahub-quickstart.log

      - name: Verify DataHub services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health > datahub-gms-health.txt; then
              break
            fi
            sleep 5
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error http://127.0.0.1:9002/ > datahub-ui.html
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Create deterministic warehouse
        run: toxicjoin-seed

      - name: Seed governed DataHub metadata
        shell: bash
        run: |
          set -o pipefail
          toxicjoin-datahub-seed --yes 2>&1 | tee datahub-seed.log

      - name: Bootstrap and index DataHub document tools
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time

          import httpx
          from datahub.sdk import DataHubClient, Document

          document_id = "toxicjoin-mcp-document-bootstrap"
          title = "ToxicJoin MCP document bootstrap"
          client = DataHubClient.from_env()
          document = Document.create_document(
              id=document_id,
              title=title,
              text=(
                  "Bootstrap document used only to ensure that DataHub's official "
                  "MCP document-content tools are registered before the independent "
                  "ToxicJoin verification process starts."
              ),
              subtype="Context",
              show_in_global_context=True,
          )
          client.entities.upsert(document)

          endpoint = "http://127.0.0.1:8080/api/graphql"
          query = """
          query BootstrapDocumentSearch($query: String!) {
            searchAcrossEntities(
              input: {
                query: $query
                count: 1
                start: 0
                types: [DOCUMENT]
              }
            ) {
              total
            }
          }
          """

          for attempt in range(1, 61):
              response = httpx.post(
                  endpoint,
                  json={"query": query, "variables": {"query": title}},
                  timeout=10.0,
              )
              response.raise_for_status()
              payload = response.json()
              if payload.get("errors"):
                  raise RuntimeError(payload["errors"])
              total = payload["data"]["searchAcrossEntities"]["total"]
              if total >= 1:
                  print(
                      f"Bootstrap document indexed after {attempt} attempt(s): "
                      f"urn:li:document:{document_id}"
                  )
                  break
              time.sleep(2)
          else:
              raise RuntimeError(
                  "DataHub bootstrap document was not indexed within 120 seconds"
              )
          PY

      - name: Verify role-separated MCP read-write-readback protocol
        shell: bash
        run: |
          set -o pipefail
          toxicjoin-datahub-spike --verify 2>&1 | tee datahub-spike.log

      - name: Verify live semantic policy decision through read-only MCP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json

          from toxicjoin.context import (
              DataHubAssetMap,
              DataHubSnapshotContextResolver,
              DataHubSnapshotLoader,
          )
          from toxicjoin.integrations.datahub_authority import (
              DataHubMcpRole,
              RoleBoundDataHubMcpClient,
              read_only_settings_from_env,
          )
          from toxicjoin.integrations.datahub_mcp import StdioDataHubMcpTransport
          from toxicjoin.models import ColumnRef, Decision, ProjectionExposureKind, ReasonCode
          from toxicjoin.policy import PolicyEngine, load_policy
          from toxicjoin.sql import analyze_sql

          async def load_snapshot():
              settings = read_only_settings_from_env()
              assert settings.mutation_enabled is False
              child_env = settings.child_environment()
              assert child_env['TOOLS_IS_MUTATION_ENABLED'] == 'false'
              assert child_env['SAVE_DOCUMENT_TOOL_ENABLED'] == 'false'
              asset_map = DataHubAssetMap.from_path('config/datahub-assets.json')
              async with StdioDataHubMcpTransport(settings) as transport:
                  client = RoleBoundDataHubMcpClient(
                      transport,
                      role=DataHubMcpRole.READ_ONLY,
                  )
                  return await DataHubSnapshotLoader(client, asset_map).load(
                      require_mutations=False
                  )

          snapshot = asyncio.run(load_snapshot())
          assert 'save_document' not in snapshot.discovered_tools
          resolver = DataHubSnapshotContextResolver(snapshot)
          policy = load_policy()
          assert policy.version == '0.2.0', policy.version

          flagship = snapshot.catalog.datasets['retention_scores'].fields['churn_score']
          flagship_lineage = {
              source.ref.key: source.category.value
              for source in flagship.lineage_sources
          }
          assert set(flagship_lineage) == {
              'location_activity.activity_count',
              'location_activity.precise_area',
              'orders.purchase_amount',
              'support_cases.case_category',
              'support_cases.sensitivity_level',
          }, flagship_lineage
          assert set(flagship_lineage.values()) == {
              'PUBLIC_OR_LOW_RISK',
              'QUASI_IDENTIFIER',
              'SENSITIVE_ATTRIBUTE',
          }, flagship_lineage

          sql = '''
          SELECT c.customer_id, r.churn_score
          FROM customers c
          JOIN retention_scores r ON c.customer_id = r.customer_id
          LIMIT 5
          '''
          plan = analyze_sql(sql, dialect='duckdb')
          context = resolver.resolve(plan)
          decision = PolicyEngine(policy).evaluate(
              context.to_policy_input(
                  task_purpose='Live DataHub P3 least-privilege semantic gate',
                  query_plan=plan,
                  subject_key=ColumnRef(
                      dataset='customers',
                      field_path='customer_id',
                      alias='c',
                  ),
              )
          )
          assert decision.decision == Decision.BLOCK, decision.model_dump(mode='json')
          assert ReasonCode.COMPOSITIONAL_REIDENTIFICATION_RISK in decision.reason_codes

          wrapped = analyze_sql(
              'SELECT UPPER(c.customer_id) AS subject_token FROM customers c LIMIT 5',
              dialect='duckdb',
          )
          assert len(wrapped.projected_exposures) == 1
          assert wrapped.projected_exposures[0].kind == ProjectionExposureKind.TRANSFORMED_RAW_VALUE
          assert {ref.key for ref in wrapped.projected_exposures[0].source_columns} == {'customers.customer_id'}

          print(json.dumps({
              'policy_version': policy.version,
              'live_semantic_decision': decision.decision.value,
              'live_semantic_reason_codes': [code.value for code in decision.reason_codes],
              'wrapped_output_kind': wrapped.projected_exposures[0].kind.value,
              'snapshot_catalog_version': snapshot.catalog.version,
              'flagship_lineage': flagship_lineage,
              'read_only_mcp': True,
              'save_document_exposed': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Validate sanitized evidence and least-privilege gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          seed = json.loads(Path('.toxicjoin/datahub-seed.json').read_text())
          spike = json.loads(Path('.toxicjoin/datahub-spike.json').read_text())

          assert seed['status'] == 'seeded'
          assert seed['tag_count'] == 10
          assert seed['term_count'] == 7
          assert seed['dataset_count'] == 5
          assert seed['field_count'] == 19
          assert seed['lineage_count'] == 4
          assert len(seed['dataset_urns']) == 5
          assert len(seed['report_sha256']) == 64

          assert spike['schema_version'] == '1.3'
          assert spike['status'] == 'verified'
          assert spike['independent_readback_verified'] is True
          assert spike['lineage_relationship_count'] == 3
          assert spike['lineage_bound_field_count'] == 2
          assert spike['lineage_source_count'] == 6
          assert spike['unclassified_lineage_source_count'] == 0
          assert set(spike['flagship_lineage_source_keys']) == {
              'location_activity.activity_count',
              'location_activity.precise_area',
              'orders.purchase_amount',
              'support_cases.case_category',
              'support_cases.sensitivity_level',
          }
          assert set(spike['flagship_lineage_categories']) == {
              'PUBLIC_OR_LOW_RISK',
              'QUASI_IDENTIFIER',
              'SENSITIVE_ATTRIBUTE',
          }
          assert len(spike['verified_entities']) == 5

          read_settings = spike['read_settings']
          write_settings = spike['write_settings']
          assert read_settings['mutation_enabled'] is False
          assert write_settings['mutation_enabled'] is True
          assert read_settings['role'] == 'read_only'
          assert write_settings['role'] == 'mutation'
          assert read_settings['document_write_enabled'] is False
          assert write_settings['document_write_enabled'] is True
          assert read_settings['writer_transport_allowlist'] == []
          assert write_settings['writer_transport_allowlist'] == ['save_document']

          mutation_prefixes = (
              'add_', 'remove_', 'set_', 'update_',
              'create_', 'delete_', 'upsert_', 'patch_',
          )
          for tool in spike['read_discovered_tools'] + spike['readback_discovered_tools']:
              assert tool != 'save_document'
              assert not tool.startswith(mutation_prefixes), tool

          raw_writer = spike['write_server_discovered_tools']
          effective_writer = spike['write_discovered_tools']
          assert 'save_document' in raw_writer
          assert effective_writer == ['save_document']
          assert set(effective_writer).issubset(set(raw_writer))

          assert spike['decision_document_urn'].startswith('urn:li:document:')
          assert len(spike['report_sha256']) == 64

          forbidden = ('password', 'secret', 'http://127.0.0.1:8080')
          raw_report = Path('.toxicjoin/datahub-spike.json').read_text().lower()
          for value in forbidden:
              assert value not in raw_report, value

          raw_mutation_extras = sorted(
              tool
              for tool in raw_writer
              if tool != 'save_document' and tool.startswith(mutation_prefixes)
          )
          print(json.dumps({
            'seed_report_sha256': seed['report_sha256'],
            'spike_report_sha256': spike['report_sha256'],
            'decision_document_urn': spike['decision_document_urn'],
            'lineage_relationship_count': spike['lineage_relationship_count'],
            'lineage_bound_field_count': spike['lineage_bound_field_count'],
            'lineage_source_count': spike['lineage_source_count'],
            'flagship_lineage_source_keys': spike['flagship_lineage_source_keys'],
            'flagship_lineage_categories': spike['flagship_lineage_categories'],
            'unclassified_lineage_source_count': spike['unclassified_lineage_source_count'],
            'independent_readback_verified': True,
            'read_server_mutation_enabled': False,
            'writer_server_mutation_registration_enabled': True,
            'writer_raw_tool_count': len(raw_writer),
            'writer_raw_mutation_extras': raw_mutation_extras,
            'writer_effective_tools': effective_writer,
            'readback_server_mutation_enabled': False,
          }, indent=2))
          PY

      - name: Capture DataHub diagnostics
        if: always()
        shell: bash
        run: |
          docker ps -a > datahub-docker-ps.txt 2>&1 || true
          docker compose ls > datahub-compose-ls.txt 2>&1 || true
          df -h > disk-usage.txt 2>&1 || true

      - name: Upload verified live evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-live-datahub-evidence
          path: |
            .toxicjoin/datahub-seed.json
            .toxicjoin/datahub-spike.json
            datahub-gms-health.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload live integration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-live-datahub-diagnostics
          path: |
            .toxicjoin/datahub-seed.json
            datahub-seed.log
            datahub-spike.log
            datahub-quickstart.log
            datahub-docker-ps.txt
            datahub-compose-ls.txt
            disk-usage.txt
          if-no-files-found: warn
          retention-days: 14
