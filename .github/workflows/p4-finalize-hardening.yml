name: P4 Finalize Supply Chain Hardening

on:
  pull_request:
    paths:
      - ".github/workflows/p4-finalize-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact P4 head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Capture immutable starting head
        shell: bash
        run: |
          set -euo pipefail
          START_SHA="$(git rev-parse HEAD)"
          test "$START_SHA" = "${{ github.event.pull_request.head.sha || github.sha }}"
          printf '%s\n' "$START_SHA" > /tmp/p4-finalize-start-sha

      - name: Apply hardening in working tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p4_finalize.py --start-sha "$(cat /tmp/p4-finalize-start-sha)"

      - name: Verify locked Python runtime and test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv sync --frozen --extra dev --extra security
          uv run --frozen ruff check src tests
          uv run --frozen pytest -q
          uv run --frozen toxicjoin-benchmark --output-dir artifacts/p4-benchmark

      - name: Verify locked Python dependency audits
        shell: bash
        run: |
          set -euo pipefail
          for PROFILE in datahub agent-registry; do
            uv export --frozen --no-emit-project --no-hashes \
              --extra "$PROFILE" --extra dev --extra security \
              --output-file "requirements-$PROFILE.txt"
            set +e
            .venv/bin/pip-audit -r "requirements-$PROFILE.txt" \
              --format json --output "pip-audit-$PROFILE.json"
            AUDIT_RC=$?
            set -e
            echo "$PROFILE pip-audit exit code: $AUDIT_RC"
            .venv/bin/python scripts/validate_dependency_audit.py python \
              --profile "$PROFILE" --audit-json "pip-audit-$PROFILE.json"
          done

      - name: Verify focused Python SAST
        run: .venv/bin/bandit -r src/toxicjoin -ll -ii -q

      - name: Verify locked web dependency graph and build
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          set +e
          npm audit --package-lock-only --json > npm-audit.json
          AUDIT_RC=$?
          set -e
          echo "npm audit exit code: $AUDIT_RC"
          python3 ../../scripts/validate_dependency_audit.py npm --audit-json npm-audit.json
          npm run check
          npm run sbom
          test -s sbom.cdx.json

      - name: Verify hardened production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag toxicjoin:p4 .
          docker volume create toxicjoin-p4-runtime >/dev/null
          docker run --detach \
            --name toxicjoin-p4 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=volume,src=toxicjoin-p4-runtime,dst=/var/lib/toxicjoin \
            --publish 18004:8000 \
            toxicjoin:p4 >/dev/null
          trap 'docker rm --force toxicjoin-p4 >/dev/null 2>&1 || true; docker volume rm toxicjoin-p4-runtime >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18004/api/health > /tmp/p4-health.json; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/p4-health.json').read_text()) == {'status': 'ok'}
          PY
              exit 0
            fi
            sleep 2
          done
          docker logs toxicjoin-p4
          exit 1

      - name: Verify static supply-chain invariants
        run: python3 scripts/validate_dependency_audit.py static

      - name: Refuse branch race and publish hardening commit
        shell: bash
        env:
          TARGET_BRANCH: security/p4-supply-chain
        run: |
          set -euo pipefail
          START_SHA="$(cat /tmp/p4-finalize-start-sha)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk 'NR==1 {print $1}')"
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            echo "Refusing finalization: branch moved from $START_SHA to $REMOTE_SHA" >&2
            exit 1
          fi
          git config user.name 'toxicjoin-security-bot'
          git config user.email 'toxicjoin-security-bot@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No hardening diff produced'; exit 1; }
          git commit -m 'P4: enforce reproducible supply-chain controls'
          git push origin "HEAD:${TARGET_BRANCH}"
