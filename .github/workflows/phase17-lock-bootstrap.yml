name: Phase 17 Lock Bootstrap

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/phase17-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/phase-17-postgres-shared-disclosure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 17 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase-17-postgres-shared-disclosure
          persist-credentials: true
          fetch-depth: 0

      - name: Generate and commit exact uv lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv lock
          git diff --exit-code --quiet -- pyproject.toml
          if git diff --exit-code --quiet -- uv.lock; then
            echo 'uv.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'build: lock PostgreSQL disclosure extra'
          git push origin HEAD:agent/phase-17-postgres-shared-disclosure
