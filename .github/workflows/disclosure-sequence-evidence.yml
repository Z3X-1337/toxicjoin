name: Disclosure Sequence Evidence

on:
  pull_request:
    paths:
      - "src/toxicjoin/disclosure/**"
      - "src/toxicjoin/execute/**"
      - "src/toxicjoin/verify/**"
      - "src/toxicjoin/pipeline.py"
      - "src/toxicjoin/auth.py"
      - "src/toxicjoin/context/**"
      - "src/toxicjoin/policy/**"
      - "src/toxicjoin/receipts/**"
      - "src/toxicjoin/api/**"
      - "src/toxicjoin/benchmark/disclosure_sequences.py"
      - "tests/security/test_cumulative_disclosure_gate.py"
      - "tests/security/test_cumulative_execution_binding.py"
      - ".github/workflows/disclosure-sequence-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cumulative-disclosure-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve and verify release candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual_sha" = "$expected_sha"
          printf '%s\n' "$actual_sha" > artifacts/release-candidate-sha.txt
          printf '%s\n' "${{ github.event.pull_request.number || 'workflow_dispatch' }}" > artifacts/target-pr-number.txt

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ToxicJoin and development tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run cumulative disclosure security regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/security/test_cumulative_disclosure_gate.py \
            tests/security/test_cumulative_execution_binding.py \
            | tee artifacts/pytest.txt

      - name: Generate cross-query sequence report
        shell: bash
        env:
          TOXICJOIN_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m toxicjoin.benchmark.disclosure_sequences \
            --output artifacts/disclosure-sequence-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/disclosure-sequence-report.json").read_text())
          expected = Path("artifacts/release-candidate-sha.txt").read_text().strip()
          assert report["passed"] is True
          assert report["release_candidate_sha"] == expected
          by_id = {case["id"]: case for case in report["cases"]}
          changed = by_id["changed_cohort_differencing_block"]
          assert changed["first"]["effective_decision"] == "ALLOW"
          assert changed["second"]["initial_decision"] == "ALLOW"
          assert changed["second"]["effective_decision"] == "BLOCK"
          assert changed["second"]["execution_attempted"] is False
          assert changed["second"]["execution_released"] is False
          assert "CUMULATIVE_DISCLOSURE_RISK" in changed["second"]["final_reason_codes"]
          assert by_id["restart_preserves_privacy_history"]["assertion"] is True
          PY

      - name: Upload cumulative disclosure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-disclosure-sequence-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
