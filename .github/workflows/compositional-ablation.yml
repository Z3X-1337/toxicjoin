name: Compositional Ablation Evidence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: compositional-ablation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compositional-ablation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ToxicJoin
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run compositional interaction ablation
        run: toxicjoin-ablation --output-dir artifacts/compositional-ablation

      - name: Upload compositional ablation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-compositional-ablation
          path: artifacts/compositional-ablation/
          if-no-files-found: error
          retention-days: 30
