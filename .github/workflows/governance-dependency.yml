name: Governance Dependency Evidence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: governance-dependency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-dependency:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project from committed lock
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.8.4'
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run governance dependency evidence
        run: toxicjoin-governance-proof --output-dir artifacts/governance-dependency

      - name: Upload governance dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-governance-dependency
          path: artifacts/governance-dependency/
          if-no-files-found: error
          retention-days: 30
