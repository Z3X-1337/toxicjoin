name: Phase 9 Immutable Release Identity

on:
  pull_request:
    paths:
      - ".github/workflows/phase9-immutable-release.yml"
      - ".github/workflows/phase5-live-datahub.yml"
      - "config/phase9-release.json"
      - "scripts/phase9_release_*.py"
      - "tests/test_phase9_release_bundle.py"
      - "docs/releases/v0.1.0.md"
      - "docs/reproducibility.md"
      - "docs/phase9-acceptance.md"
      - "docs/durable-evidence.md"
  workflow_run:
    workflows: ["Generated Release Manifest"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: phase9-release-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  release-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Verify locked Phase 9 contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.8.4"
          python scripts/bootstrap.py verify --components python,uv,locks,contract
          python scripts/bootstrap.py sync --extra dev
          uv run --frozen ruff check \
            scripts/phase9_release_bundle.py \
            scripts/phase9_release_verify.py \
            tests/test_phase9_release_bundle.py
          uv run --frozen pytest -q tests/test_phase9_release_bundle.py
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          config = json.loads(Path("config/phase9-release.json").read_text())
          project = tomllib.loads(Path("pyproject.toml").read_text())
          assert config["version"] == project["project"]["version"]
          assert config["tag"] == f"v{config['version']}"
          assert config["immutable_identity"] is True
          assert config["draft"] is False
          assert config["prerelease"] is False
          PY

  release-preview:
    if: github.event_name == 'pull_request'
    needs: release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      PHASE9_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PHASE9_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Wait for exact-head candidate Release Manifest
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7500))
          while (( SECONDS < deadline )); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Generated Release Manifest" \
              --commit "$PHASE9_SOURCE_SHA" \
              --event pull_request \
              --limit 20 \
              --json databaseId,status,conclusion,headSha \
              | jq -c --arg sha "$PHASE9_SOURCE_SHA" \
                '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last // empty')"
            if [[ -n "$run_json" ]]; then
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              run_id="$(jq -r '.databaseId' <<<"$run_json")"
              if [[ "$status" == completed ]]; then
                test "$conclusion" = success
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Timed out waiting for exact-head candidate Release Manifest" >&2
          exit 1
      - name: Download exact-head candidate Release Manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase9/manifest
          gh run download "${{ steps.candidate.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name toxicjoin-candidate-release-manifest \
            --dir artifacts/phase9/manifest
      - name: Download and verify exact-head SBOM artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase9/input
          python - <<'PY' > artifacts/phase9/sbom-artifacts.tsv
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("artifacts/phase9/manifest/candidate-release-manifest.json").read_text()
          )
          required = {
              "web-supply-chain",
              "hosted-replay-supply-chain",
              "python-supply-chain-datahub",
              "python-supply-chain-agent-registry",
          }
          records = {
              item["name"]: item
              for item in manifest["gates"]["Supply Chain Security"]["artifacts"]
              if item["name"] in required
          }
          assert set(records) == required
          for name in sorted(records):
              item = records[name]
              print(name, item["id"], item["digest"].removeprefix("sha256:"), sep="\t")
          PY
          while IFS=$'\t' read -r name artifact_id digest; do
            output="artifacts/phase9/input/${name}.zip"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$output"
            printf '%s  %s\n' "$digest" "$output" | sha256sum --check -
          done < artifacts/phase9/sbom-artifacts.tsv
      - name: Assemble deterministic release preview
        shell: bash
        env:
          PHASE9_GENERATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          python scripts/phase9_release_bundle.py \
            --root . \
            --config config/phase9-release.json \
            --manifest artifacts/phase9/manifest/candidate-release-manifest.json \
            --artifact-dir artifacts/phase9/input \
            --output-dir artifacts/phase9/preview \
            --source-sha "$PHASE9_SOURCE_SHA" \
            --mode candidate
          (cd artifacts/phase9/preview && sha256sum --check SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path("artifacts/phase9/preview/phase9-release-bundle-report.json").read_text()
          )
          assert report["status"] == "verified"
          assert report["mode"] == "candidate"
          assert report["source_sha"] == "${{ env.PHASE9_SOURCE_SHA }}"
          assert report["release_side_effects"] is False
          assert report["asset_count"] == 11
          PY
      - name: Verify pull-request run created no tag or Release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python -c 'import json; print(json.load(open("config/phase9-release.json"))["tag"])')"
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Refusing preview: tag ${tag} already exists" >&2
            exit 1
          fi
          if gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "Refusing preview: Release ${tag} already exists" >&2
            exit 1
          fi
      - name: Upload exact-head release preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase9-immutable-release-preview
          path: artifacts/phase9/preview
          if-no-files-found: error
          retention-days: 90

  publish-and-verify-release:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PHASE9_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      PHASE9_MANIFEST_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PHASE9_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact current-main identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PHASE9_SOURCE_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$PHASE9_SOURCE_SHA"
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Download exact-main Release Manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase9/manifest
          gh run download "$PHASE9_MANIFEST_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name toxicjoin-generated-release-manifest \
            --dir artifacts/phase9/manifest
      - name: Download and verify exact-main SBOM artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase9/input
          python - <<'PY' > artifacts/phase9/sbom-artifacts.tsv
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/phase9/manifest/release-manifest.json").read_text())
          required = {
              "web-supply-chain",
              "hosted-replay-supply-chain",
              "python-supply-chain-datahub",
              "python-supply-chain-agent-registry",
          }
          records = {
              item["name"]: item
              for item in manifest["gates"]["Supply Chain Security"]["artifacts"]
              if item["name"] in required
          }
          assert set(records) == required
          for name in sorted(records):
              item = records[name]
              print(name, item["id"], item["digest"].removeprefix("sha256:"), sep="\t")
          PY
          while IFS=$'\t' read -r name artifact_id digest; do
            output="artifacts/phase9/input/${name}.zip"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$output"
            printf '%s  %s\n' "$digest" "$output" | sha256sum --check -
          done < artifacts/phase9/sbom-artifacts.tsv
      - name: Assemble exact-main release assets
        shell: bash
        env:
          PHASE9_GENERATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python scripts/phase9_release_bundle.py \
            --root . \
            --config config/phase9-release.json \
            --manifest artifacts/phase9/manifest/release-manifest.json \
            --artifact-dir artifacts/phase9/input \
            --output-dir artifacts/phase9/release \
            --source-sha "$PHASE9_SOURCE_SHA" \
            --mode release
          (cd artifacts/phase9/release && sha256sum --check SHA256SUMS)
      - name: Resolve release identity and reject conflicts
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python -c 'import json; print(json.load(open("config/phase9-release.json"))["tag"])')"
          name="$(python -c 'import json; print(json.load(open("config/phase9-release.json"))["release_name"])')"
          manifest_hash="$(python -c 'import json; print(json.load(open("artifacts/phase9/release/phase9-release-bundle-report.json"))["manifest_sha256"])')"
          tag_exists=false
          release_exists=false
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > artifacts/phase9/tag-ref.json 2>/dev/null; then
            tag_exists=true
          fi
          if gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > artifacts/phase9/release.json 2>/dev/null; then
            release_exists=true
          fi
          test "$tag_exists" = "$release_exists"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "manifest_hash=$manifest_hash" >> "$GITHUB_OUTPUT"
          echo "exists=$tag_exists" >> "$GITHUB_OUTPUT"
      - name: Create annotated tag and published GitHub Release
        if: steps.identity.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.identity.outputs.tag }}" "$PHASE9_SOURCE_SHA" \
            -m "${{ steps.identity.outputs.name }}" \
            -m "Exact commit: $PHASE9_SOURCE_SHA" \
            -m "Release Manifest SHA-256: ${{ steps.identity.outputs.manifest_hash }}"
          git push origin "refs/tags/${{ steps.identity.outputs.tag }}"
          mapfile -t assets < <(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/phase9/release/phase9-release-bundle-report.json").read_text())
          for name in report["assets"]:
              print(Path("artifacts/phase9/release") / name)
          PY
          )
          gh release create "${{ steps.identity.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$PHASE9_SOURCE_SHA" \
            --title "${{ steps.identity.outputs.name }}" \
            --notes-file artifacts/phase9/release/RELEASE_NOTES.md \
            "${assets[@]}"
      - name: Fetch and resolve published tag and Release
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.identity.outputs.tag }}"
          gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > artifacts/phase9/tag-ref.json
          object_type="$(jq -r '.object.type' artifacts/phase9/tag-ref.json)"
          object_sha="$(jq -r '.object.sha' artifacts/phase9/tag-ref.json)"
          if [[ "$object_type" == tag ]]; then
            gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" > artifacts/phase9/tag-object.json
            echo "annotated=true" >> "$GITHUB_OUTPUT"
          elif [[ "$object_type" == commit ]]; then
            echo "annotated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported tag object type: $object_type" >&2
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > artifacts/phase9/release.json
          rm -rf artifacts/phase9/downloaded-release-assets
          mkdir -p artifacts/phase9/downloaded-release-assets
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts/phase9/downloaded-release-assets
      - name: Verify immutable release identity and downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --config config/phase9-release.json
            --release-json artifacts/phase9/release.json
            --tag-ref-json artifacts/phase9/tag-ref.json
            --asset-dir artifacts/phase9/downloaded-release-assets
            --source-sha "$PHASE9_SOURCE_SHA"
            --manifest-sha256 "${{ steps.identity.outputs.manifest_hash }}"
            --output artifacts/phase9/phase9-release-verification.json
          )
          if [[ "${{ steps.tag.outputs.annotated }}" == true ]]; then
            args+=(--tag-object-json artifacts/phase9/tag-object.json)
          fi
          python scripts/phase9_release_verify.py "${args[@]}"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/phase9/phase9-release-verification.json").read_text())
          assert report["status"] == "verified"
          assert report["source_sha"] == "${{ env.PHASE9_SOURCE_SHA }}"
          assert report["tag_resolved_sha"] == "${{ env.PHASE9_SOURCE_SHA }}"
          PY
      - name: Upload release-identity verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase9-immutable-release-verification
          path: |
            artifacts/phase9/phase9-release-verification.json
            artifacts/phase9/release/phase9-release-bundle-report.json
            artifacts/phase9/release/SHA256SUMS
            artifacts/phase9/tag-ref.json
            artifacts/phase9/tag-object.json
            artifacts/phase9/release.json
          if-no-files-found: error
          retention-days: 90
