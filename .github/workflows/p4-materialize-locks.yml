name: P4 Materialize Audited Locks

on:
  pull_request:
    paths:
      - ".github/workflows/p4-materialize-locks.yml"
      - "pyproject.toml"
      - "apps/web/package.json"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-materialize-locks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact production branch head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Record immutable start head
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          test "$ORIGINAL_SHA" = "${{ github.event.pull_request.head.sha || github.sha }}"
          printf '%s\n' "$ORIGINAL_SHA" > /tmp/p4-original-sha
          mkdir -p p4-bootstrap
          printf '%s\n' "$ORIGINAL_SHA" > p4-bootstrap/source-head-sha.txt
          python3 --version | tee p4-bootstrap/python-version.txt
          node --version | tee p4-bootstrap/node-version.txt
          npm --version | tee p4-bootstrap/npm-version.txt

      - name: Generate universal Python lock and audit both DataHub profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'uv==0.8.4' 'pip-audit==2.9.0'
          uv --version | tee p4-bootstrap/uv-version.txt
          pip-audit --version | tee p4-bootstrap/pip-audit-version.txt

          uv lock
          uv export --frozen --no-emit-project --no-hashes \
            --extra datahub --extra dev --extra security \
            --output-file p4-bootstrap/requirements-datahub.txt
          uv export --frozen --no-emit-project --no-hashes \
            --extra agent-registry --extra dev --extra security \
            --output-file p4-bootstrap/requirements-agent-registry.txt

          set +e
          pip-audit -r p4-bootstrap/requirements-datahub.txt \
            --format json --output p4-bootstrap/pip-audit-datahub.json
          DATAHUB_AUDIT_RC=$?
          pip-audit -r p4-bootstrap/requirements-agent-registry.txt \
            --format json --output p4-bootstrap/pip-audit-agent-registry.json
          AGENT_AUDIT_RC=$?
          set -e
          printf '%s\n' "$DATAHUB_AUDIT_RC" > p4-bootstrap/pip-audit-datahub.exit-code.txt
          printf '%s\n' "$AGENT_AUDIT_RC" > p4-bootstrap/pip-audit-agent-registry.exit-code.txt

      - name: Generate npm lock and audit it
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          set +e
          npm audit --package-lock-only --json > ../../p4-bootstrap/npm-audit.json
          NPM_AUDIT_RC=$?
          set -e
          printf '%s\n' "$NPM_AUDIT_RC" > ../../p4-bootstrap/npm-audit.exit-code.txt

      - name: Resolve current Docker base image digests
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22-alpine >/dev/null
          docker pull python:3.12-slim >/dev/null
          {
            docker inspect --format='node:22-alpine={{index .RepoDigests 0}}' node:22-alpine
            docker inspect --format='python:3.12-slim={{index .RepoDigests 0}}' python:3.12-slim
          } | tee p4-bootstrap/base-image-digests.txt

      - name: Summarize audit findings without hiding failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('p4-bootstrap')

          def pip_summary(name: str) -> dict:
              path = root / f'pip-audit-{name}.json'
              payload = json.loads(path.read_text())
              dependencies = payload.get('dependencies', []) if isinstance(payload, dict) else []
              findings = []
              for dep in dependencies:
                  for vuln in dep.get('vulns', []):
                      findings.append({
                          'package': dep.get('name'),
                          'version': dep.get('version'),
                          'id': vuln.get('id'),
                          'fix_versions': vuln.get('fix_versions', []),
                      })
              return {
                  'exit_code': int((root / f'pip-audit-{name}.exit-code.txt').read_text().strip()),
                  'finding_count': len(findings),
                  'findings': findings,
              }

          npm_payload = json.loads((root / 'npm-audit.json').read_text())
          npm_meta = npm_payload.get('metadata', {}).get('vulnerabilities', {})
          npm_vulns = npm_payload.get('vulnerabilities', {})
          npm_findings = [
              {
                  'package': package,
                  'severity': details.get('severity'),
                  'is_direct': details.get('isDirect'),
                  'fix_available': details.get('fixAvailable'),
              }
              for package, details in sorted(npm_vulns.items())
          ]

          summary = {
              'python_datahub': pip_summary('datahub'),
              'python_agent_registry': pip_summary('agent-registry'),
              'npm': {
                  'exit_code': int((root / 'npm-audit.exit-code.txt').read_text().strip()),
                  'metadata': npm_meta,
                  'finding_count': len(npm_findings),
                  'findings': npm_findings,
              },
              'docker_base_images': (root / 'base-image-digests.txt').read_text().splitlines(),
              'source_head_sha': (root / 'source-head-sha.txt').read_text().strip(),
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Verify branch did not move and commit generated evidence
        shell: bash
        env:
          TARGET_BRANCH: security/p4-supply-chain
        run: |
          set -euo pipefail
          ORIGINAL_SHA="$(cat /tmp/p4-original-sha)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk 'NR==1 {print $1}')"
          test -n "$REMOTE_SHA"
          if [ "$REMOTE_SHA" != "$ORIGINAL_SHA" ]; then
            echo "Refusing to materialize locks: branch moved from $ORIGINAL_SHA to $REMOTE_SHA" >&2
            exit 1
          fi

          git config user.name 'toxicjoin-security-bot'
          git config user.email 'toxicjoin-security-bot@users.noreply.github.com'
          git add uv.lock apps/web/package-lock.json p4-bootstrap/
          git diff --cached --exit-code && exit 0
          git commit -m 'P4: materialize reproducible dependency locks'
          git push origin "HEAD:${TARGET_BRANCH}"
