name: Phase 0 Hosted Replay Freshness Validation

on:
  pull_request:
    paths:
      - ".github/workflows/validation-hosted-replay-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-0-hosted-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-hosted-replay-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_MAIN_SHA: "25a18b872d21ed91abdec3ad1893c07b5f424621"
      REPLAY_URL: https://toxicjoin-replay.vercel.app/
      CANDIDATE_DIR: /tmp/toxicjoin-phase0-replay-main
      EVIDENCE_DIR: validation-artifacts/hosted-replay-freshness

    steps:
      - name: Check out independent validation workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Resolve and pin exact current main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          if [[ ! "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve refs/heads/main" >&2
            exit 1
          fi
          if [[ "$MAIN_SHA" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "main moved; hosted replay freshness target is stale" >&2
            exit 1
          fi
          printf '%s\n' "$MAIN_SHA" > "$EVIDENCE_DIR/current-main-sha.txt"
          git fetch --no-tags --depth=1 origin "$MAIN_SHA"
          git worktree add --detach "$CANDIDATE_DIR" "$MAIN_SHA"
          test "$(git -C "$CANDIDATE_DIR" rev-parse HEAD)" = "$MAIN_SHA"

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked browser automation client
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Discover preinstalled Chrome or Edge
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          browser_path=""
          for command_name in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge microsoft-edge-stable; do
            candidate=$(command -v "$command_name" || true)
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              browser_path="$candidate"
              break
            fi
          done
          if [[ -z "$browser_path" ]]; then
            browser_path=$(find /usr/bin /opt -maxdepth 4 -type f \
              \( -name 'google-chrome*' -o -name 'chromium*' -o -name 'microsoft-edge*' \) \
              -perm -111 2>/dev/null | head -n 1 || true)
          fi
          if [[ -z "$browser_path" ]]; then
            echo "No supported preinstalled browser was found." >&2
            exit 1
          fi
          echo "path=$browser_path" >> "$GITHUB_OUTPUT"
          "$browser_path" --version

      - name: Fetch live replay document and provenance
        shell: bash
        run: |
          set -euo pipefail
          document_status=$(curl --location --silent --show-error \
            --output "$EVIDENCE_DIR/live-index.html" \
            --write-out '%{http_code}' "$REPLAY_URL")
          provenance_status=$(curl --location --silent --show-error \
            --output "$EVIDENCE_DIR/live-provenance.json" \
            --write-out '%{http_code}' "${REPLAY_URL}provenance.json")
          test "$document_status" = "200"
          test "$provenance_status" = "200"

      - name: Validate provenance identity and immutable asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          candidate = Path(os.environ["CANDIDATE_DIR"])
          live_html = evidence.joinpath("live-index.html").read_text(encoding="utf-8")
          live_provenance = json.loads(evidence.joinpath("live-provenance.json").read_text(encoding="utf-8"))
          repo_provenance = json.loads(candidate.joinpath("public/replay/provenance.json").read_text(encoding="utf-8"))

          required_identity_fields = (
              "schema_version",
              "source_workflow_run",
              "source_pr",
              "source_commit",
              "source_artifact_id",
              "source_artifact_digest",
          )
          for key in required_identity_fields:
              if live_provenance.get(key) != repo_provenance.get(key):
                  raise SystemExit(f"live provenance identity field differs: {key}")

          repo_keys = set(repo_provenance)
          live_keys = set(live_provenance)
          dropped_fields = sorted(repo_keys - live_keys)
          added_fields = sorted(live_keys - repo_keys)
          if dropped_fields not in ([], ["artifact_name"]):
              raise SystemExit(f"unexpected live provenance dropped fields: {dropped_fields}")
          if added_fields not in ([], ["materialized_commit"]):
              raise SystemExit(f"unexpected live provenance added fields: {added_fields}")

          pattern = re.compile(
              r"https://cdn\.jsdelivr\.net/gh/Z3X-1337/toxicjoin@([0-9a-f]{40})/public/replay/assets/([^\"']+)"
          )
          refs = pattern.findall(live_html)
          if len(refs) != 2:
              raise SystemExit(f"expected exactly two immutable asset references, got {len(refs)}")
          asset_commits = sorted({commit for commit, _ in refs})
          if len(asset_commits) != 1:
              raise SystemExit("live replay assets are not bound to one immutable commit")
          asset_commit = asset_commits[0]

          materialized_commit = str(live_provenance.get("materialized_commit", ""))
          if not re.fullmatch(r"[0-9a-f]{40}", materialized_commit):
              raise SystemExit("live materialized_commit is missing or malformed")
          if materialized_commit != asset_commit:
              raise SystemExit("live materialized_commit does not bind the immutable asset commit")

          assets = []
          filenames = []
          for commit, filename in refs:
              local_path = candidate / "public" / "replay" / "assets" / filename
              if not local_path.is_file():
                  raise SystemExit(f"asset missing from exact-main public/replay: {filename}")
              data = local_path.read_bytes()
              filenames.append(filename)
              assets.append({
                  "filename": filename,
                  "immutable_commit": commit,
                  "repository_sha256": hashlib.sha256(data).hexdigest(),
                  "repository_bytes": len(data),
              })

          source_commit = str(live_provenance.get("source_commit", ""))
          if not re.fullmatch(r"[0-9a-f]{40}", source_commit):
              raise SystemExit("provenance source_commit is malformed")

          shape_drift = bool(dropped_fields or added_fields)
          evidence.joinpath("source-commit.txt").write_text(source_commit + "\n", encoding="utf-8")
          evidence.joinpath("asset-commit.txt").write_text(asset_commit + "\n", encoding="utf-8")
          evidence.joinpath("asset-files.txt").write_text("\n".join(sorted(filenames)) + "\n", encoding="utf-8")
          evidence.joinpath("preliminary.json").write_text(
              json.dumps({
                  "schema_version": "1.4",
                  "validation_main_sha": os.environ["EXPECTED_MAIN_SHA"],
                  "live_url": os.environ["REPLAY_URL"],
                  "live_document_status": 200,
                  "live_provenance_status": 200,
                  "provenance_identity_fields_match": True,
                  "provenance_shape_matches_repository": not shape_drift,
                  "provenance_drift": {
                      "dropped_fields": dropped_fields,
                      "added_fields": added_fields,
                  },
                  "repository_artifact_name": repo_provenance.get("artifact_name"),
                  "live_artifact_name": live_provenance.get("artifact_name"),
                  "artifact_name_preserved": live_provenance.get("artifact_name") == repo_provenance.get("artifact_name"),
                  "provenance_source_commit": source_commit,
                  "materialized_commit": materialized_commit,
                  "immutable_asset_commit": asset_commit,
                  "source_artifact_id": live_provenance.get("source_artifact_id"),
                  "source_artifact_digest": live_provenance.get("source_artifact_digest"),
                  "source_workflow_run": live_provenance.get("source_workflow_run"),
                  "source_pr": live_provenance.get("source_pr"),
                  "assets": sorted(assets, key=lambda item: item["filename"]),
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Establish git relationship and immutable blob identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(cat "$EVIDENCE_DIR/source-commit.txt")"
          ASSET_COMMIT="$(cat "$EVIDENCE_DIR/asset-commit.txt")"
          git fetch --no-tags --prune --unshallow origin main || git fetch --no-tags --prune origin main
          git fetch --no-tags origin "$SOURCE_COMMIT" "$ASSET_COMMIT"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git cat-file -e "${ASSET_COMMIT}^{commit}"

          relationship() {
            local candidate="$1"
            local current="$2"
            if [[ "$candidate" == "$current" ]]; then
              printf 'CURRENT\n'
            elif git merge-base --is-ancestor "$candidate" "$current"; then
              printf 'ANCESTOR\n'
            elif git merge-base --is-ancestor "$current" "$candidate"; then
              printf 'DESCENDANT\n'
            else
              printf 'DIVERGED\n'
            fi
          }

          SOURCE_RELATIONSHIP="$(relationship "$SOURCE_COMMIT" "$EXPECTED_MAIN_SHA")"
          ASSET_RELATIONSHIP="$(relationship "$ASSET_COMMIT" "$EXPECTED_MAIN_SHA")"
          SOURCE_MERGE_BASE="$(git merge-base "$SOURCE_COMMIT" "$EXPECTED_MAIN_SHA")"
          ASSET_MERGE_BASE="$(git merge-base "$ASSET_COMMIT" "$EXPECTED_MAIN_SHA")"
          SOURCE_UNIQUE="$(git rev-list --count "${EXPECTED_MAIN_SHA}..${SOURCE_COMMIT}")"
          MAIN_UNIQUE_FROM_SOURCE="$(git rev-list --count "${SOURCE_COMMIT}..${EXPECTED_MAIN_SHA}")"
          ASSET_UNIQUE="$(git rev-list --count "${EXPECTED_MAIN_SHA}..${ASSET_COMMIT}")"
          MAIN_UNIQUE_FROM_ASSET="$(git rev-list --count "${ASSET_COMMIT}..${EXPECTED_MAIN_SHA}")"

          printf '%s\n' "$SOURCE_RELATIONSHIP" > "$EVIDENCE_DIR/source-relationship.txt"
          printf '%s\n' "$ASSET_RELATIONSHIP" > "$EVIDENCE_DIR/asset-relationship.txt"
          printf '%s\n' "$SOURCE_MERGE_BASE" > "$EVIDENCE_DIR/source-merge-base.txt"
          printf '%s\n' "$ASSET_MERGE_BASE" > "$EVIDENCE_DIR/asset-merge-base.txt"
          printf '%s\n' "$SOURCE_UNIQUE" > "$EVIDENCE_DIR/source-unique.txt"
          printf '%s\n' "$MAIN_UNIQUE_FROM_SOURCE" > "$EVIDENCE_DIR/main-unique-from-source.txt"
          printf '%s\n' "$ASSET_UNIQUE" > "$EVIDENCE_DIR/asset-unique.txt"
          printf '%s\n' "$MAIN_UNIQUE_FROM_ASSET" > "$EVIDENCE_DIR/main-unique-from-asset.txt"

          : > "$EVIDENCE_DIR/blob-identity.tsv"
          while IFS= read -r filename; do
            pinned_blob=$(git rev-parse "${ASSET_COMMIT}:public/replay/assets/${filename}")
            main_blob=$(git rev-parse "${EXPECTED_MAIN_SHA}:public/replay/assets/${filename}")
            test "$pinned_blob" = "$main_blob"
            printf '%s\t%s\t%s\n' "$filename" "$pinned_blob" "$main_blob" >> "$EVIDENCE_DIR/blob-identity.tsv"
          done < "$EVIDENCE_DIR/asset-files.txt"

      - name: Verify desktop and mobile live replay in Chromium
        working-directory: ${{ env.CANDIDATE_DIR }}
        env:
          BROWSER_EXECUTABLE: ${{ steps.browser.outputs.path }}
          REPLAY_URL: ${{ env.REPLAY_URL }}
        run: node scripts/verify_hosted_replay.mjs

      - name: Build final freshness evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "$CANDIDATE_DIR/artifacts/hosted-replay/verification.json" "$EVIDENCE_DIR/browser-verification.json"
          cp "$CANDIDATE_DIR/artifacts/hosted-replay/diagnostics.json" "$EVIDENCE_DIR/browser-diagnostics.json"
          cp "$CANDIDATE_DIR/artifacts/hosted-replay/desktop.png" "$EVIDENCE_DIR/desktop.png"
          cp "$CANDIDATE_DIR/artifacts/hosted-replay/mobile.png" "$EVIDENCE_DIR/mobile.png"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          report = json.loads(evidence.joinpath("preliminary.json").read_text(encoding="utf-8"))
          browser = json.loads(evidence.joinpath("browser-verification.json").read_text(encoding="utf-8"))
          diagnostics = json.loads(evidence.joinpath("browser-diagnostics.json").read_text(encoding="utf-8"))
          current_main = os.environ["EXPECTED_MAIN_SHA"]
          source_commit = report["provenance_source_commit"]
          asset_commit = report["immutable_asset_commit"]

          source_relationship = evidence.joinpath("source-relationship.txt").read_text().strip()
          asset_relationship = evidence.joinpath("asset-relationship.txt").read_text().strip()
          source_merge_base = evidence.joinpath("source-merge-base.txt").read_text().strip()
          asset_merge_base = evidence.joinpath("asset-merge-base.txt").read_text().strip()
          source_unique = int(evidence.joinpath("source-unique.txt").read_text().strip())
          main_unique_from_source = int(evidence.joinpath("main-unique-from-source.txt").read_text().strip())
          asset_unique = int(evidence.joinpath("asset-unique.txt").read_text().strip())
          main_unique_from_asset = int(evidence.joinpath("main-unique-from-asset.txt").read_text().strip())

          blob_rows = []
          for line in evidence.joinpath("blob-identity.tsv").read_text(encoding="utf-8").splitlines():
              filename, pinned_blob, main_blob = line.split("\t")
              blob_rows.append({
                  "filename": filename,
                  "pinned_blob": pinned_blob,
                  "current_main_blob": main_blob,
                  "match": pinned_blob == main_blob,
              })
          if len(blob_rows) != 2 or not all(row["match"] for row in blob_rows):
              raise SystemExit("immutable Git blob identity check failed")

          for profile in diagnostics.get("profiles", []):
              responses = profile.get("asset_responses", [])
              if len(responses) != 2:
                  raise SystemExit("browser did not observe exactly two immutable assets")
              for response in responses:
                  if response.get("status") != 200:
                      raise SystemExit("browser observed failed immutable asset response")
                  if f"@{asset_commit}/public/replay/assets/" not in str(response.get("url", "")):
                      raise SystemExit("browser asset URL does not match materialized commit")

          has_shape_drift = not report["provenance_shape_matches_repository"]
          if source_relationship == "CURRENT" and asset_relationship == "CURRENT":
              classification = "CURRENT_MAIN_WITH_PROVENANCE_SHAPE_DRIFT" if has_shape_drift else "CURRENT_MAIN"
          elif source_relationship == "ANCESTOR" and asset_relationship == "ANCESTOR":
              classification = (
                  "HISTORICAL_ANCESTOR_WITH_PROVENANCE_SHAPE_DRIFT"
                  if has_shape_drift
                  else "HISTORICAL_ANCESTOR"
              )
          elif "DIVERGED" in {source_relationship, asset_relationship}:
              classification = (
                  "HISTORICAL_VERIFIED_DIVERGED_LINEAGE_WITH_PROVENANCE_SHAPE_DRIFT"
                  if has_shape_drift
                  else "HISTORICAL_VERIFIED_DIVERGED_LINEAGE"
              )
          else:
              classification = "NON_CURRENT_VERIFIED_RELATIONSHIP"

          report.update({
              "source_relationship_to_current_main": source_relationship,
              "asset_relationship_to_current_main": asset_relationship,
              "source_merge_base": source_merge_base,
              "asset_merge_base": asset_merge_base,
              "source_unique_commits_vs_current_main": source_unique,
              "current_main_unique_commits_vs_source": main_unique_from_source,
              "asset_unique_commits_vs_current_main": asset_unique,
              "current_main_unique_commits_vs_asset": main_unique_from_asset,
              "source_commit_equals_current_main": source_commit == current_main,
              "asset_commit_equals_current_main": asset_commit == current_main,
              "immutable_git_blobs_match_current_main": True,
              "immutable_blob_identity": blob_rows,
              "browser_asset_responses_verified": True,
              "freshness_classification": classification,
              "browser_verification_passed": True,
              "browser_profile_count": len(browser.get("profiles", [])),
              "disclosure": browser.get("disclosure"),
              "interpretation": (
                  "The public replay is live; critical provenance identity and artifact-digest fields match the committed replay; "
                  "the live deployment provenance changes shape by dropping artifact_name and adding materialized_commit; "
                  "the source and materialization commits are on verified Git relationships to current main, including divergence when present; "
                  "the immutable replay asset blobs are identical to those retained in exact current main and desktop/mobile browsers load the pinned assets."
              ),
          })
          canonical = json.dumps(report, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
          report["report_sha256"] = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          evidence.joinpath("freshness.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if report["browser_profile_count"] != 2:
              raise SystemExit("expected desktop and mobile browser profiles")
          if "no live execution or DataHub write is being claimed" not in str(report["disclosure"]):
              raise SystemExit("replay disclosure missing")
          print(json.dumps({
              "freshness_classification": classification,
              "source_relationship": source_relationship,
              "asset_relationship": asset_relationship,
              "source_unique": source_unique,
              "main_unique_from_source": main_unique_from_source,
              "asset_unique": asset_unique,
              "main_unique_from_asset": main_unique_from_asset,
              "provenance_drift": report["provenance_drift"],
              "report_sha256": report["report_sha256"],
          }, sort_keys=True))
          PY
          rm -f \
            "$EVIDENCE_DIR/preliminary.json" \
            "$EVIDENCE_DIR/blob-identity.tsv" \
            "$EVIDENCE_DIR/asset-files.txt" \
            "$EVIDENCE_DIR/source-relationship.txt" \
            "$EVIDENCE_DIR/asset-relationship.txt" \
            "$EVIDENCE_DIR/source-merge-base.txt" \
            "$EVIDENCE_DIR/asset-merge-base.txt" \
            "$EVIDENCE_DIR/source-unique.txt" \
            "$EVIDENCE_DIR/main-unique-from-source.txt" \
            "$EVIDENCE_DIR/asset-unique.txt" \
            "$EVIDENCE_DIR/main-unique-from-asset.txt"

      - name: Upload sanitized hosted replay freshness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toxicjoin-phase0-hosted-replay-freshness
          path: |
            validation-artifacts/hosted-replay-freshness/current-main-sha.txt
            validation-artifacts/hosted-replay-freshness/live-index.html
            validation-artifacts/hosted-replay-freshness/live-provenance.json
            validation-artifacts/hosted-replay-freshness/freshness.json
            validation-artifacts/hosted-replay-freshness/browser-verification.json
            validation-artifacts/hosted-replay-freshness/browser-diagnostics.json
            validation-artifacts/hosted-replay-freshness/desktop.png
            validation-artifacts/hosted-replay-freshness/mobile.png
          if-no-files-found: warn
          retention-days: 30
