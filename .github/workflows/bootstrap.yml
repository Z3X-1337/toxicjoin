name: Reproducible Locked Bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".github/workflows/ci.yml"
      - "config/toolchain.json"
      - "scripts/bootstrap.py"
      - "tests/test_bootstrap_contract.py"
      - "run.sh"
      - "run.ps1"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - "vercel.json"
      - "docs/bootstrap.md"
      - "docs/judge-testing.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Set up exact Node.js and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install exact uv bootstrap
        run: python -m pip install --disable-pip-version-check "uv==0.8.4"

      - name: Verify machine-readable authority
        run: >-
          python scripts/bootstrap.py verify
          --components python,uv,node,npm,docker,locks,contract

      - name: Reject lock-bypass and moving-toolchain paths
        run: python scripts/bootstrap.py audit

      - name: Sync exact development profile
        run: python scripts/bootstrap.py sync --extra dev

      - name: Validate bootstrap contract tests
        run: uv run --frozen pytest -q tests/test_bootstrap_contract.py

  native-bootstrap:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.11.15", "3.12.13"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PHASE3_EVIDENCE_DIR: ${{ runner.temp }}/phase3-evidence

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Set up exact Node.js and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install exact uv bootstrap
        run: python -m pip install --disable-pip-version-check "uv==0.8.4"

      - name: Verify exact toolchain and locks
        run: >-
          python scripts/bootstrap.py verify
          --components python,uv,node,npm,locks,contract
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/toolchain-preflight.json"

      - name: Frozen sync first pass
        run: >-
          python scripts/bootstrap.py sync
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/sync-first.json"

      - name: Frozen sync second pass
        run: >-
          python scripts/bootstrap.py sync
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/sync-second.json"

      - name: Verify sync idempotency
        run: >-
          python -c "import json,pathlib;
          root=pathlib.Path(r'${{ env.PHASE3_EVIDENCE_DIR }}');
          a=json.loads((root/'sync-first.json').read_text());
          b=json.loads((root/'sync-second.json').read_text());
          assert a['lock_hashes_after']==b['lock_hashes_after'];
          assert a['installed_package_identity']['sha256']==b['installed_package_identity']['sha256']"

      - name: Install root Node tooling from exact lock
        run: npm ci --no-audit --no-fund

      - name: Install frontend from exact lock
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck, test, and build frontend
        working-directory: apps/web
        run: npm run check

      - name: Verify fixture startup and readiness
        run: >-
          python scripts/bootstrap.py smoke
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/fixture-smoke.json"

      - name: Remove known generated TypeScript build state
        run: >-
          python -c "from pathlib import Path;
          Path('apps/web/tsconfig.tsbuildinfo').unlink(missing_ok=True)"

      - name: Verify worktree remains unchanged
        run: >-
          python scripts/bootstrap.py cleanliness
          --output "${{ env.PHASE3_EVIDENCE_DIR }}/worktree-cleanliness.json"

      - name: Generate content-addressed bootstrap evidence
        run: >-
          python scripts/bootstrap.py evidence
          --output-dir "${{ env.PHASE3_EVIDENCE_DIR }}"

      - name: Upload exact-platform bootstrap evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-bootstrap-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ env.PHASE3_EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
